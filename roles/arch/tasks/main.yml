- name: Check whether the temporary AUR builder account already exists
  ansible.builtin.getent:
    database: passwd
    key: aur_builder
    fail_key: false

- name: Check whether the temporary AUR sudoers file already exists
  become: true
  ansible.builtin.stat:
    path: /etc/sudoers.d/11-install-aur_builder
  register: arch_aur_sudoers

- name: Preserve pre-existing AUR builder accounts
  ansible.builtin.assert:
    that:
      - ansible_facts.getent_passwd.aur_builder is none
      - not arch_aur_sudoers.stat.exists
    fail_msg: >-
      The aur_builder account or its sudoers file already exists. Review both
      before running this playbook; an existing account will not be modified or deleted.

- name: Manage workstation packages with a temporary AUR builder
  block:
    - name: Create AUR builder user
      ansible.builtin.include_tasks: create_aur_builder_user.yml

    - name: Upgrade packages
      ansible.builtin.include_tasks: upgrade_packages.yml

    - name: Install CLI tools
      ansible.builtin.include_tasks: install_cli_tools.yml

    - name: Install applications
      ansible.builtin.include_tasks: install_applications.yml

    - name: Install fonts
      ansible.builtin.include_tasks: install_fonts.yml

    - name: Configure default shell
      ansible.builtin.include_tasks: configure_default_shell.yml

  always:
    - name: Remove AUR builder user and sudoers access
      ansible.builtin.include_tasks: remove_aur_builder_user.yml
