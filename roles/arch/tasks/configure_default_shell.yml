---
- name: Get path to zsh
  ansible.builtin.shell: command -v zsh # noqa: command-instead-of-shell -- command is a shell builtin
  register: arch_zsh_path_result
  changed_when: false

- name: Set Zsh as default shell
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts.user_id }}"
    shell: "{{ arch_zsh_path_result.stdout }}"
