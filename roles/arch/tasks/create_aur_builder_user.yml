- name: Create the aur_builder user
  become: true
  ansible.builtin.user:
    name: aur_builder
    create_home: true

- name: Allow the `aur_builder` user to run `sudo pacman` without a password
  become: true
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/11-install-aur_builder
    line: "aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman"
    create: true
    mode: "0440"
    validate: "visudo -cf %s"

- name: Fetch the 1Password signing key for AUR verification
  become: true
  become_user: aur_builder
  ansible.builtin.get_url:
    url: https://downloads.1password.com/linux/keys/1password.asc
    dest: /home/aur_builder/1password.asc
    mode: "0600"

- name: Inspect the AUR signing key
  become: true
  become_user: aur_builder
  ansible.builtin.command:
    argv: [gpg, --show-keys, --with-colons, /home/aur_builder/1password.asc]
  register: arch_signing_key
  changed_when: false

- name: Verify the AUR signing key fingerprint
  ansible.builtin.assert:
    that: "'fpr:::::::::3FEF9748469ADBE15DA7CA80AC2D62742012EA22:' in arch_signing_key.stdout"

- name: Import the verified AUR signing key
  become: true
  become_user: aur_builder
  ansible.builtin.command:
    argv: [gpg, --batch, --import, /home/aur_builder/1password.asc]
  changed_when: true # This is a newly created temporary keyring.
