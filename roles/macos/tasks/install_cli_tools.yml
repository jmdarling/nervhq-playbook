- name: Install command line tools via Homebrew
  loop: "{{ cli_tools }}"
  when:
    - item.macos is defined
    - item.macos.source == 'brew'
  community.general.homebrew:
    name: "{{ item.macos.name | default(item.name) }}"
    state: "{{ 'latest' if workstation_upgrade_packages else 'present' }}"
  become: false

- name: Install or upgrade verified releases
  ansible.builtin.include_tasks: ../../common/tasks/install_release.yml
  loop: "{{ cli_tools }}"
  when:
    - item.macos is defined
    - item.macos.source == 'script'
