- name: Update package manager cache
  ansible.builtin.include_tasks: update_package_manager_cache.yml

- name: Install CLI tools
  ansible.builtin.include_tasks: install_cli_tools.yml

- name: Install applications
  ansible.builtin.include_tasks: install_applications.yml

- name: Install fonts
  ansible.builtin.include_tasks: install_fonts.yml

- name: Configure default shell
  ansible.builtin.include_tasks: configure_default_shell.yml

- name: Upgrade all installed Homebrew formulae
  community.general.homebrew:
    upgrade_all: true
  when: workstation_upgrade_packages

- name: Upgrade all installed Homebrew casks including self-updating apps
  community.general.homebrew_cask:
    upgrade_all: true
    greedy: true
  when: workstation_upgrade_packages
