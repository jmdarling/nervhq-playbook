# Bootstrap through the CLI so older Ansible versions do not need the Python
# package-manager bindings in order to install those same bindings.
- name: Check the system Python package-manager bindings
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - "import {{ 'libdnf5' if ansible_facts.pkg_mgr == 'dnf5' else 'dnf' }}"
  register: fedora_dnf_bindings
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install missing system Python package-manager bindings
  become: true
  ansible.builtin.command:
    argv:
      - dnf
      - install
      - -y
      - "{{ 'python3-libdnf5' if ansible_facts.pkg_mgr == 'dnf5' else 'python3-dnf' }}"
  when: fedora_dnf_bindings.rc != 0
  changed_when: true

- name: Install Fedora prerequisites
  become: true
  ansible.builtin.dnf:
    name: [/usr/bin/curl, tar, gzip, unzip, fontconfig, flatpak, gnupg2]
    state: present

- name: Configure user Flathub remote
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    method: user
    state: present

- name: Trust vendor signing keys by fingerprint
  become: true
  ansible.builtin.rpm_key:
    key: "{{ item.key }}"
    fingerprint: "{{ item.fingerprint }}"
    state: present
  loop:
    - key: https://packages.microsoft.com/keys/microsoft.asc
      fingerprint: BC528686B50D79E339D3721CEB3E94ADBE1229CF
    - key: https://downloads.1password.com/linux/keys/1password.asc
      fingerprint: 3FEF9748469ADBE15DA7CA80AC2D62742012EA22

- name: Trust Brave release signing keys
  become: true
  ansible.builtin.rpm_key:
    key: https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
    fingerprint: DBF1A116C220B8C7164F98230686B78420038257
    state: present

- name: Configure vendor repositories before package installation
  ansible.builtin.import_tasks: configure_vendor_repositories.yml
