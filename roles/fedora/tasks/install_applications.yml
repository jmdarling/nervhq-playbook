- name: Enable COPR repository for DNF applications
  loop: "{{ applications }}"
  when:
    - item.fedora is defined
    - item.fedora.source == 'dnf'
    - item.fedora.copr is defined
  # community.general.copr requires DNF4's Python bindings; use COPR's repo file with DNF5.
  ansible.builtin.get_url:
    url: >-
      https://copr.fedorainfracloud.org/coprs/{{ item.fedora.copr }}/repo/fedora-{{ ansible_facts.distribution_major_version }}/dnf.repo?arch={{ ansible_facts.architecture }}
    dest: "/etc/yum.repos.d/_copr:copr.fedorainfracloud.org:{{ item.fedora.copr | replace('/', ':') }}.repo"
    mode: "0644"
  become: true

- name: Install applications via DNF
  loop: "{{ applications }}"
  when:
    - item.fedora is defined
    - item.fedora.source == 'dnf'
  ansible.builtin.dnf5:
    name: "{{ item.fedora.name | default(item.name) }}"
    state: present # DNF packages will be updated holistically in a separate task.
  become: true

- name: Install applications via Flatpak
  loop: "{{ applications }}"
  when:
    - item.fedora is defined
    - item.fedora.source == 'flatpak'
  community.general.flatpak:
    name: "{{ item.fedora.name | default(item.name) }}"
    state: "{{ 'latest' if workstation_upgrade_packages else 'present' }}"
    method: user
    remote: flathub
  become: false

- name: Install applications via shell script
  loop: "{{ applications }}"
  when:
    - item.fedora is defined
    - item.fedora.source == 'script'
    - item.fedora.script_name is defined
  ansible.builtin.script:
    cmd: "{{ item.fedora.script_name }}"
    creates: "{{ item.fedora.creates | default(omit) }}"
  become: true
