- name: Enable COPR repository for DNF command line tools
  loop: "{{ cli_tools }}"
  when:
    - item.fedora is defined
    - item.fedora.source == 'dnf'
    - item.fedora.copr is defined
  vars:
    fedora_copr_base: "https://copr.fedorainfracloud.org/coprs/{{ item.fedora.copr }}/repo"
  # community.general.copr requires DNF4's Python bindings; use COPR's repo file with DNF5.
  ansible.builtin.get_url:
    url: >-
      {{ fedora_copr_base }}/fedora-{{ ansible_facts.distribution_major_version }}/dnf.repo?arch={{ ansible_facts.architecture }}
    dest: "/etc/yum.repos.d/_copr:copr.fedorainfracloud.org:{{ item.fedora.copr | replace('/', ':') }}.repo"
    mode: "0644"
  become: true

- name: Install command line tools via DNF
  loop: "{{ cli_tools }}"
  when:
    - item.fedora is defined
    - item.fedora.source == 'dnf'
  ansible.builtin.dnf5:
    name: "{{ item.fedora.name | default(item.name) }}"
    state: "{{ 'latest' if workstation_upgrade_packages else 'present' }}"
  become: true

- name: Install or upgrade verified releases
  ansible.builtin.include_tasks: ../../common/tasks/install_release.yml
  loop: "{{ cli_tools }}"
  when:
    - item.fedora is defined
    - item.fedora.source == 'script'
