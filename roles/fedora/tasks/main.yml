- name: Bootstrap package sources
  ansible.builtin.import_tasks: bootstrap.yml

- name: Bootstrap official ChatGPT before routine repository upgrades
  ansible.builtin.include_tasks: bootstrap_chatgpt.yml
  when: >-
    applications | selectattr('name', 'equalto', 'chatgpt') | selectattr('fedora', 'defined') |
    selectattr('fedora.source', 'equalto', 'dnf') | list | length > 0

- name: Upgrade packages
  ansible.builtin.include_tasks: upgrade_packages.yml
  when: workstation_upgrade_packages

- name: Install CLI tools
  ansible.builtin.include_tasks: install_cli_tools.yml

- name: Install applications
  ansible.builtin.include_tasks: install_applications.yml

- name: Install fonts
  ansible.builtin.include_tasks: install_fonts.yml

- name: Configure default shell
  ansible.builtin.include_tasks: configure_default_shell.yml

- name: List installed user Flatpak applications
  ansible.builtin.command:
    argv: [flatpak, list, --user, --app, --columns=application]
  register: fedora_flatpak_apps
  changed_when: false
  check_mode: false
  when: workstation_upgrade_packages

- name: Upgrade all installed user Flatpak applications
  community.general.flatpak:
    name: "{{ fedora_flatpak_apps.stdout_lines }}"
    state: latest
    method: user
  when:
    - workstation_upgrade_packages
    - fedora_flatpak_apps.stdout_lines | length > 0
