cli_tools:
  # Development Tools
  - name: git
    macos:
      source: brew
  - name: neovim
    fedora:
      source: dnf
    macos:
      source: brew
  - name: volta
    fedora:
      source: script
      script_name: install-volta.sh
      creates: "{{ ansible_facts.env.HOME }}/.volta/bin/volta"
    macos:
      source: script
      script_name: install-volta.sh
      creates: "{{ ansible_facts.env.HOME }}/.volta/bin/volta"

  # File & Directory Tools
  - name: fzf
    fedora:
      source: dnf
    macos:
      source: brew
  - name: stow
    fedora:
      source: dnf
    macos:
      source: brew
  - name: zoxide
    fedora:
      source: dnf
    macos:
      source: brew

  # Shell & Terminal Enhancement
  - name: starship
    fedora:
      source: script
      script_name: install-starship.sh
      creates: "{{ ansible_facts.env.HOME }}/.local/bin/starship"
    macos:
      source: brew
  - name: zsh
    fedora:
      source: dnf

  # System Information
  - name: fastfetch
    fedora:
      source: dnf
    macos:
      source: brew
