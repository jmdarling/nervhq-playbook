- name: NervHQ Fedora workstation setup
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    workstation_os: fedora

  pre_tasks:
    - name: Validate workstation prerequisites
      ansible.builtin.import_tasks: tasks/preflight.yml
      tags: always

  tasks:
    - name: Include Fedora role
      ansible.builtin.include_role:
        name: fedora

  post_tasks:
    - name: Configure the user environment
      ansible.builtin.import_tasks: tasks/user_environment.yml
