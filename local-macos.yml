- name: NervHQ MacOS workstation setup
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    workstation_os: macos

  pre_tasks:
    - name: Validate workstation prerequisites
      ansible.builtin.import_tasks: tasks/preflight.yml
      tags: always

  tasks:
    - name: Include macOS role
      ansible.builtin.include_role:
        name: macos

  post_tasks:
    - name: Configure the user environment
      ansible.builtin.import_tasks: tasks/user_environment.yml
